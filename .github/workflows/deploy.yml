name: Deploy Backend (Systemd)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go binary
        run: |
          cd services/backend
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w" -o api ./cmd/api

      # Upload as temporary name
      - name: Upload binary
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: services/backend/api
          target: /var/www/butuhbantuan-app/backend/
          overwrite: true

      # Force replace safely
      - name: Replace & Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            sudo rm -rf /var/www/butuhbantuan-app/backend/api
            sudo mv /var/www/butuhbantuan-app/backend/services/backend/api /var/www/butuhbantuan-app/backend/api 2>/dev/null || true
            sudo chmod 755 /var/www/butuhbantuan-app/backend/api
            sudo chown butuhbantuan:butuhbantuan /var/www/butuhbantuan-app/backend/api
            sudo systemctl restart backend
            sudo systemctl status backend --no-pager
