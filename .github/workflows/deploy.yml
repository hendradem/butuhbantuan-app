name: Deploy Backend Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ================= CHECKOUT =================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================= SETUP GO =================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # ================= BUILD =================
      - name: Build Go Binary
        run: |
          cd services/backend
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w" -o api ./cmd/api

      # ================= PREPARE VPS =================
      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            mkdir -p /var/www/butuhbantuan-app/backend

      # ================= UPLOAD BINARY =================
      - name: Upload Binary
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: services/backend/api
          target: /var/www/butuhbantuan-app/backend/
          overwrite: true

      # ================= RESTART =================
      - name: Restart Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            pm2 reload backend || pm2 start /var/www/butuhbantuan-app/backend/api \
              --name backend \
              --interpreter none \
              --cwd /var/www/butuhbantuan-app/backend

            pm2 save
