name: Deploy Backend (Systemd)

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      run_seed:
        description: "Run database seeder?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # =========================
      # BUILD IN CI
      # =========================
      - name: Build Go Binary
        run: |
          cd services/backend
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w" -o go-api-service ./cmd/api

      # =========================
      # CLEAN TARGET DIRECTORY
      # =========================
      - name: Clean VPS Backend Folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /var/www/butuhbantuan-app/backend
            sudo rm -rf /var/www/butuhbantuan-app/backend/*
            sudo chown -R butuhbantuan:butuhbantuan /var/www/butuhbantuan-app

      # =========================
      # UPLOAD BINARY
      # =========================
      - name: Upload Binary to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: services/backend/go-api-service
          target: /var/www/butuhbantuan-app/backend/
          strip_components: 2

      # =========================
      # PERMISSION + OPTIONAL SEED + RESTART
      # =========================
      - name: Restart Backend Service (and optionally seed)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            sudo chmod 755 /var/www/butuhbantuan-app/backend/go-api-service
            sudo chown butuhbantuan:butuhbantuan /var/www/butuhbantuan-app/backend/go-api-service

            # Stop service before any operation
            sudo systemctl stop backend

            # Run seeder ONLY if manually triggered
            if [ "${{ github.event.inputs.run_seed }}" = "true" ]; then
              echo "🔧 Running Seeder..."
              /var/www/butuhbantuan-app/backend/go-api-service --seed
              echo "✅ Seeder completed"
            fi

            # Restart backend
            sudo systemctl start backend
            sudo systemctl status backend --no-pager
