name: Deploy Backend (Systemd)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v4

      # 2️⃣ Setup Go
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # 3️⃣ Build binary (Linux)
      - name: Build Go binary
        run: |
          cd services/backend
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w" -o api ./cmd/api

      # 4️⃣ Ensure folder exists
      - name: Prepare VPS directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /var/www/butuhbantuan-app/backend
            sudo chown -R $USER:$USER /var/www/butuhbantuan-app/backend

      # 5️⃣ Upload ONLY binary
      - name: Upload binary
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: services/backend/api
          target: /var/www/butuhbantuan-app/backend/api
          overwrite: true

      # 6️⃣ Restart via systemd
      - name: Restart backend service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            sudo systemctl restart backend
            sudo systemctl status backend --no-pager
