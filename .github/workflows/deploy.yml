name: Deploy Backend (Systemd)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # =========================
      # BUILD DI CI (MONOREPO)
      # =========================
      - name: Build Go Binary
        run: |
          cd services/backend
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w" -o go-service.bin ./cmd/api

      # =========================
      # UPLOAD HANYA FILE BINARY
      # =========================
      - name: Upload Binary to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: services/backend/go-service.bin
          target: /var/www/butuhbantuan-app/backend/
          overwrite: true

      # =========================
      # SET PERMISSION + RESTART
      # =========================
      - name: Restart Backend Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            sudo chown butuhbantuan:butuhbantuan /var/www/butuhbantuan-app/backend/go-service.bin
            sudo chmod 755 /var/www/butuhbantuan-app/backend/go-service.bin
            sudo systemctl restart backend
            sudo systemctl status backend --no-pager
