name: Deploy Production

on:
  push:
    branches:
      - master

env:
  APP_DIR: /var/www/butuhbantuan-apps

jobs:
  # ────────────────────────────────────────────
  # 1. Build Go binary
  # ────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/backend/go.sum

      - name: Build Go binary
        run: |
          set -e
          cd services/backend
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o api ./cmd/api
          ls -lah api

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: services/backend/api
          retention-days: 1

  # ────────────────────────────────────────────
  # 2. Build Next.js standalone bundle
  # ────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next app (standalone)
        run: pnpm --filter next-app build

      - name: Package standalone output
        run: |
          set -e
          NEXT_DIR=apps/next-app/.next

          # Copy static assets and public into the standalone bundle
          cp -r $NEXT_DIR/static $NEXT_DIR/standalone/.next/static
          [ -d apps/next-app/public ] && cp -r apps/next-app/public $NEXT_DIR/standalone/public || true

          tar -czf next-build.tar.gz -C $NEXT_DIR/standalone .
          ls -lah next-build.tar.gz

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: next-build.tar.gz
          retention-days: 1

  # ────────────────────────────────────────────
  # 3. Deploy both artifacts to VPS
  # ────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: artifacts/backend

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: artifacts/frontend

      # Upload to ~/deploy_tmp (home dir — always writable) then move via SSH.
      # This avoids scp-action failing on permission-restricted /var/www paths.
      - name: Upload backend binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: "artifacts/backend/api"
          target: "~/deploy_tmp/"
          overwrite: true

      - name: Upload frontend archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: "artifacts/frontend/next-build.tar.gz"
          target: "~/deploy_tmp/"
          overwrite: true

      - name: Install & restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            set -e

            BACKEND_DIR=${{ env.APP_DIR }}/backend
            FRONTEND_DIR=${{ env.APP_DIR }}/frontend

            # Ensure target dirs exist.
            # NOTE: On first run, your deploy user must own APP_DIR.
            # Run this once on your VPS manually:
            #   sudo mkdir -p /var/www/butuhbantuan-apps
            #   sudo chown -R butuhbantuan:butuhbantuan /var/www/butuhbantuan-apps
            mkdir -p "$BACKEND_DIR" "$FRONTEND_DIR"

            # ── Backend ───────────────────────────────────────
            # scp-action mirrors the source path under ~/deploy_tmp,
            # so the binary lands at ~/deploy_tmp/artifacts/backend/api
            mv ~/deploy_tmp/artifacts/backend/api "$BACKEND_DIR/api"
            chmod +x "$BACKEND_DIR/api"

            # ── Frontend ──────────────────────────────────────
            rm -rf "$FRONTEND_DIR"
            mkdir -p "$FRONTEND_DIR"
            tar -xzf ~/deploy_tmp/artifacts/frontend/next-build.tar.gz -C "$FRONTEND_DIR"

            # ── Cleanup ───────────────────────────────────────
            rm -rf ~/deploy_tmp

            # ── Restart via PM2 ───────────────────────────────
            pm2 describe backend > /dev/null 2>&1 \
              && pm2 restart backend \
              || pm2 start "$BACKEND_DIR/api" --name backend --interpreter none

            pm2 describe next-app > /dev/null 2>&1 \
              && pm2 restart next-app \
              || pm2 start "$FRONTEND_DIR/server.js" --name next-app

            pm2 save
