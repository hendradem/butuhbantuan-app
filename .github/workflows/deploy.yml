name: Deploy Backend (Systemd)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Setup Go
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # 3️⃣ Build binary dari services/backend
      - name: Build Go binary
        run: |
          cd services/backend
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w" -o api ./cmd/api

      # 4️⃣ Upload bin file to VPS
      - name: Upload binary
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: services/backend/api
          target: /var/www/butuhbantuan-app/backend/
          strip_components: 2
          overwrite: true

      # 5️⃣ Fix permission & restart
      - name: Restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            sudo chmod 755 /var/www/butuhbantuan-app/backend/api
            sudo chown butuhbantuan:butuhbantuan /var/www/butuhbantuan-app/backend/api
            sudo systemctl restart backend
            sudo systemctl status backend --no-pager
