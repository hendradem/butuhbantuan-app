name: Deploy Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ================= BACKEND SERVICE BUILD =================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go binary
        run: |
          set -e
          cd services/backend
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o api ./cmd/api
          ls -lah api

      # ================= FRONTEND BUILD =================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next app (standalone)
        run: |
          set -e
          pnpm --filter next-app build
          cd apps/next-app
          ls -lah
          tar -czf next-build.tar.gz .next public
          ls -lah next-build.tar.gz

      # ================= PREPARE VPS =================
      - name: Prepare directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            mkdir -p /var/www/butuhbantuan-app/backend
            mkdir -p /var/www/butuhbantuan-app/frontend

      # ================= UPLOAD BACKEND =================
      - name: Upload backend binary
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: services/backend/api
          target: /var/www/butuhbantuan-app/backend/api
          overwrite: true

      # ================= UPLOAD NEXT =================
      - name: Upload Next build archive
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          source: apps/next-app/next-build.tar.gz
          target: /var/www/butuhbantuan-app/
          overwrite: true

      # ================= RESTART =================
      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR=/var/www/butuhbantuan-app
            FRONTEND_DIR=$APP_DIR/frontend
            BACKEND_DIR=$APP_DIR/backend

            # Ensure backend executable
            chmod +x $BACKEND_DIR/api

            # Clean frontend
            rm -rf $FRONTEND_DIR/.next
            mkdir -p $FRONTEND_DIR

            # Extract tar directly into frontend
            tar -xzf $APP_DIR/next-build.tar.gz -C $FRONTEND_DIR
            rm $APP_DIR/next-build.tar.gz

            # Backend
            pm2 reload backend || pm2 start $BACKEND_DIR/api --name backend

            # Frontend
            pm2 reload next-app || pm2 start $FRONTEND_DIR/.next/standalone/server.js --name next-app

            pm2 save
