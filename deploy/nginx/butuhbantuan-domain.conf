# ButuhBantuan — domain mode with 3 subdomains.
# Replace DOMAIN with your actual root domain (e.g. butuhbantuan.id).
#
# After DNS is live, get TLS:
#   sudo certbot --nginx -d api.DOMAIN -d app.DOMAIN -d dashboard.DOMAIN

# ── API — api.DOMAIN ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.DOMAIN;
    client_max_body_size 20M;

    location ~* /(sse|stream|events) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── Web-app (static PWA) — app.DOMAIN ────────────────────────────────────────
server {
    listen 80;
    server_name app.DOMAIN;

    root /opt/butuhbantuan/web-app/dist;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /sw.js                { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Dashboard (Nuxt SSR) — dashboard.DOMAIN ──────────────────────────────────
server {
    listen 80;
    server_name dashboard.DOMAIN;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
    }
}
