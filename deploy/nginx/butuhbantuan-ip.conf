# ButuhBantuan — IP mode (no domain yet).
# Copy to /etc/nginx/sites-available/butuhbantuan then:
#   ln -sf /etc/nginx/sites-available/butuhbantuan /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Access:
#   http://<VPS-IP>       → web-app (static PWA)
#   http://<VPS-IP>:8080  → dashboard (Nuxt SSR)
#   http://<VPS-IP>:8081  → API (Go/Fiber)

# ── Web-app (default vhost, static) ──────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    root /opt/butuhbantuan/web-app/dist;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Service worker & manifest must revalidate every load
    location = /sw.js                { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Fingerprinted assets: cache for a year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Dashboard on port 8080 ───────────────────────────────────────────────────
server {
    listen 8080;
    server_name _;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
    }
}

# ── API on port 8081 ─────────────────────────────────────────────────────────
server {
    listen 8081;
    server_name _;
    client_max_body_size 20M;

    # SSE endpoints — no buffering, long timeouts
    location ~* /(sse|stream|events) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Connection        '';
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
